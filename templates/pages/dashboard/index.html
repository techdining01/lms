{% extends "layout/app.html" %}

{% block app_content %}

<div class="space-y-8">

    <div>

        <h1 class="text-3xl font-bold">

            Welcome Back,
            {{ first_name }}

        </h1>

        <p class="text-muted-foreground">

            {{ welcome_title }}

        </p>

    </div>

    <div
        class="
        grid
        gap-4
        md:grid-cols-2
        xl:grid-cols-4
        "
    >

        <c-stats-card
            title="Courses"
            value="12"
        />

        <c-stats-card
            title="Assignments"
            value="8"
        />

        <c-stats-card
            title="Exams"
            value="4"
        />

        <c-stats-card
            title="Certificates"
            value="2"
        />

    </div>

    <c-card>

        <div class="p-6">

            <h2
                class="
                text-lg
                font-semibold
                "
            >
                Continue Learning
            </h2>

            <div class="mt-4">

                Django Masterclass

                <div
                    class="
                    h-3
                    bg-muted
                    rounded-full
                    mt-2
                    "
                >

                    <div
                        class="
                        h-3
                        w-3/4
                        bg-primary
                        rounded-full
                        "
                    ></div>

                </div>

            </div>

        </div>

    </c-card>

</div>

{% endblock %}

{% extends "layout/auth.html" %}
{% load i18n %}

{% block title %}
Create Account
{% endblock %}

{% block auth_content %}

<div class="space-y-6">

    <div class="text-center">

        <h1 class="text-2xl font-bold">
            Create Account
        </h1>

        <p class="text-muted-foreground">
            Join Brills LMS
        </p>

    </div>

    <form method="post" class="space-y-4">

        {% csrf_token %}

       {{ form.as_p }}

        <c-button type="submit">
            Register
        </c-button>

    </form>

</div>

{% endblock %}

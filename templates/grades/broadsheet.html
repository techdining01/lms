<c-ui.page-header
    title="Class Broadsheet"
/>

<div class="overflow-x-auto">

<table class="w-full">

<thead>

<tr>

<th>Student</th>

<th>Average</th>

<th>Position</th>

</tr>

</thead>

<tbody>

{% for result in results %}

<tr>

<td>
{{ result.student }}
</td>

<td>
{{ result.average }}
</td>

<td>
{{ result.position }}
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

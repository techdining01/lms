<div
    x-data="{ open:false }"
    class="relative flex-shrink-0"
>

    <c-button
        variant="ghost"
        size="icon"
        @click="open=!open"
    >
        🔔
    </c-button>

    <div
        x-show="open"
        x-transition
        @click.outside="open=false"
        class="
        absolute
        right-0
        mt-2
        w-80
        rounded-xl
        border
        bg-background
        shadow-lg
        p-4
        z-50
        "
    >

        <h3 class="font-semibold">

            Notifications

        </h3>

        <div
            class="
            mt-3
            text-sm
            text-muted-foreground
            "
        >
            No notifications available.
        </div>

    </div>

</div>

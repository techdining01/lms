<header
    class="
    sticky
    top-0
    z-50
    border-b
    bg-background/95
    backdrop-blur-sm
    shadow-sm
    transition-colors
    "
>

    <div
        class="
        h-16 md:h-20
        flex
        items-center
        justify-between
        px-4 md:px-6
        gap-2 md:gap-3
        "
    >

        <div class="lg:hidden">

            <c-app-logo />

        </div>

        <div class="hidden md:block flex-1 max-w-lg">

            <input
                type="search"
                placeholder="Search courses..."
                class="
                w-full
                rounded-lg
                border
                px-4
                py-2
                "
            >

        </div>

        <div
            class="
            flex
            items-center
            gap-3
            "
        >

            {# Theme toggle: calls window.toggleTheme() defined in base.html #}
            <button
                id="theme-toggle"
                aria-label="Toggle dark mode"
                class="p-2 rounded-md hover:bg-muted flex-shrink-0"
                onclick="window.toggleTheme && window.toggleTheme()"
            >
                <span id="theme-icon">🌙</span>
            </button>

            <c-notification-bell />

            <c-user-menu />

        </div>

    </div>

</header>

<div
    class="
        overflow-hidden
        rounded-xl
        border
        bg-background
    "
>

    <img
        src="{{ course.thumbnail.url }}"
        alt="{{ course.title }}"
        class="
            h-48
            w-full
            object-cover
        "
    >

    <div class="p-4">

        <h3
            class="
                font-semibold
                line-clamp-2
            "
        >
            {{ course.title }}
        </h3>

        <p
            class="
                mt-2
                text-sm
                text-muted-foreground
            "
        >
            {{ course.instructor }}
        </p>

        <div
            class="
                mt-4
                flex
                items-center
                justify-between
            "
        >

            <span>
                ₦{{ course.price }}
            </span>

            <a
                href="{% url 'learning:detail' course.slug %}"
            >
                View
            </a>

        </div>

    </div>

</div>
